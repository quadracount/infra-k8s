# Desarrollo local. Se ejecuta desde infra-k8s, con todos los repos clonados en la misma carpeta:
#   docker compose up --build
# Las imágenes se llaman quadracount/<repo>:dev, igual que en los manifiestos de k8s/.
name: quadracount

x-rabbitmq-url: &rabbitmq-url amqp://${RABBITMQ_USER:-quadra}:${RABBITMQ_PASSWORD:-quadra}@rabbitmq:5672

services:
  mongodb:
    image: mongo:8
    # Solo accesible desde este PC (127.0.0.1): MongoDB no tiene contraseña en desarrollo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      # El usuario guest de RabbitMQ solo funciona desde localhost, por eso se crea otro
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-quadra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quadra}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  activity-service:
    build: ../activity-service
    image: quadracount/activity-service:dev
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: activity_db
      RABBITMQ_URL: *rabbitmq-url
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  groups-service:
    build: ../groups-service
    image: quadracount/groups-service:dev
    environment:
      GRPC_PORT: "50051"
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: groups_db
      RABBITMQ_URL: *rabbitmq-url
      BALANCES_GRPC_URL: balances-service:50052
      # Crea los usuarios y el grupo de ejemplo si no existen
      SEED_DEMO: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  balances-service:
    build: ../balances-service
    image: quadracount/balances-service:dev
    environment:
      GRPC_PORT: "50052"
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: balances_db
      RABBITMQ_URL: *rabbitmq-url
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  bff-gateway:
    build: ../bff-gateway
    image: quadracount/bff-gateway:dev
    # Solo desde este PC (127.0.0.1), como el resto de los puertos de desarrollo
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      RABBITMQ_URL: *rabbitmq-url
      GROUPS_GRPC_URL: groups-service:50051
      BALANCES_GRPC_URL: balances-service:50052
      MCP_SERVER_URL: http://mcp-server:3001
      # Orígenes desde los que el navegador puede llamar al BFF (frontend en Docker y en `pnpm dev`)
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      rabbitmq:
        condition: service_healthy
      groups-service:
        condition: service_started
      balances-service:
        condition: service_started
    restart: unless-stopped

  mcp-server:
    build: ../mcp-server
    image: quadracount/mcp-server:dev
    environment:
      PORT: "3001"
      BFF_INTERNAL_URL: http://bff-gateway:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      # "fallback": parser por reglas. "llm": Claude (necesita ANTHROPIC_API_KEY)
      LLM_MODE: ${LLM_MODE:-fallback}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

  frontend-app:
    build: ../frontend-quadracount
    image: quadracount/frontend-quadracount:dev
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  mongo-data:
