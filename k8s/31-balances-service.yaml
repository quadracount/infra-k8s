# balances-service (Go, gRPC 50052): saldos, plan para saldar cuentas y pagos.
# 1 réplica por la misma razón que groups-service (gRPC y ClusterIP).
# Prueba de resiliencia de la demo:
#   kubectl scale deployment balances-service --replicas=0 -n quadracount
apiVersion: v1
kind: Service
metadata:
  name: balances-service
  namespace: quadracount
  labels:
    app.kubernetes.io/name: balances-service
    app.kubernetes.io/part-of: quadracount
spec:
  selector:
    app.kubernetes.io/name: balances-service
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: balances-service
  namespace: quadracount
  labels:
    app.kubernetes.io/name: balances-service
    app.kubernetes.io/part-of: quadracount
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: balances-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: balances-service
        app.kubernetes.io/part-of: quadracount
    spec:
      containers:
        - name: balances-service
          image: quadracount/balances-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
          env:
            - name: GRPC_PORT
              value: "50052"
            - name: MONGO_DB
              value: balances_db
            - name: MONGO_USER
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: MONGO_USER }
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: MONGO_PASSWORD }
            - name: MONGO_URL
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb:27017/?authSource=admin
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: RABBITMQ_PASSWORD }
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
          startupProbe:
            grpc: { port: 50052 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            grpc: { port: 50052 }
            periodSeconds: 10
          livenessProbe:
            grpc: { port: 50052 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
