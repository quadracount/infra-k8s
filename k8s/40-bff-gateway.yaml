# bff-gateway (NestJS, puerto 3000): GraphQL en /graphql y REST interno en /internal.
# Es la única puerta de entrada. Desde el navegador:
#   kubectl port-forward svc/bff-gateway 3000:3000 -n quadracount
apiVersion: v1
kind: Service
metadata:
  name: bff-gateway
  namespace: quadracount
  labels:
    app.kubernetes.io/name: bff-gateway
    app.kubernetes.io/part-of: quadracount
spec:
  selector:
    app.kubernetes.io/name: bff-gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-gateway
  namespace: quadracount
  labels:
    app.kubernetes.io/name: bff-gateway
    app.kubernetes.io/part-of: quadracount
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff-gateway
        app.kubernetes.io/part-of: quadracount
    spec:
      containers:
        - name: bff-gateway
          image: quadracount/bff-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # GROUPS_GRPC_URL, BALANCES_GRPC_URL, MCP_SERVER_URL, DEV_USER_ID...
            - configMapRef:
                name: quadracount-config
          env:
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: JWT_SECRET }
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: INTERNAL_API_KEY }
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: RABBITMQ_PASSWORD }
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
          startupProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
