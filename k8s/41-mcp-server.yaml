# mcp-server (Node.js, puerto 3001): REST /automation y MCP en /mcp.
# replicas: 0 hasta la Fase 5, porque todavía no hay servidor que escuche.
# Para encenderlo: kubectl scale deployment mcp-server --replicas=1 -n quadracount
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: quadracount
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: quadracount
spec:
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: quadracount
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: quadracount
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/part-of: quadracount
    spec:
      containers:
        - name: mcp-server
          image: quadracount/mcp-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: BFF_INTERNAL_URL
              valueFrom:
                configMapKeyRef: { name: quadracount-config, key: BFF_INTERNAL_URL }
            - name: LLM_MODE
              valueFrom:
                configMapKeyRef: { name: quadracount-config, key: LLM_MODE }
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: { name: quadracount-secrets, key: INTERNAL_API_KEY }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                # Opcional: sin la key, LLM_MODE=fallback sigue funcionando
                secretKeyRef: { name: quadracount-secrets, key: ANTHROPIC_API_KEY, optional: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
