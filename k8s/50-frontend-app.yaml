# frontend-app (React servido con nginx, puerto 80). Desde el navegador:
#   kubectl port-forward svc/frontend-app 8080:80 -n quadracount   ->  http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: frontend-app
  namespace: quadracount
  labels:
    app.kubernetes.io/name: frontend-app
    app.kubernetes.io/part-of: quadracount
spec:
  selector:
    app.kubernetes.io/name: frontend-app
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: quadracount
  labels:
    app.kubernetes.io/name: frontend-app
    app.kubernetes.io/part-of: quadracount
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-app
        app.kubernetes.io/part-of: quadracount
    spec:
      containers:
        - name: frontend-app
          image: quadracount/frontend-quadracount:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
